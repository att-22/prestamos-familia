name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  # Sin filtro de rutas: los checks obligatorios deben ejecutarse en todos los PR
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test -- --run

      - name: Build
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

  # Despliegue en Vercel: preview en cada PR, producción al llegar a main.
  # Se salta solo mientras no existan los secrets VERCEL_* (ver README).
  deploy:
    name: Frontend deploy
    needs: test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: ${{ github.event_name == 'push' && '--prod' || '' }}

      - name: Deploy skipped
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::Despliegue omitido - faltan los secrets VERCEL_TOKEN, VERCEL_ORG_ID y VERCEL_PROJECT_ID"
