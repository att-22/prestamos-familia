name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prestamos
          POSTGRES_PASSWORD: prestamos_test
          POSTGRES_DB: prestamos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prestamos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://prestamos:prestamos_test@localhost:5432/prestamos_test
      SUPABASE_JWT_SECRET: test-secret
      SUPABASE_URL: http://localhost
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type check (mypy)
        run: mypy app/

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v --cov=app --cov-report=term-missing

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Solo verifica que la imagen de producción se construye.
      # El despliegue real (Railway/Render) se conecta al repo desde su panel.
      - name: Build production image
        run: docker build -t prestamos-backend ./backend
