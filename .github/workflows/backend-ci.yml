name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
    branches: [main, develop]
  pull_request:
    paths:
      - 'backend/**'
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prestamos
          POSTGRES_PASSWORD: prestamos_test
          POSTGRES_DB: prestamos_test
        ports: 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
      
      - name: Run linting
        working-directory: ./backend
        run: |
          ruff check app/
          mypy app/
      
      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://prestamos:prestamos_test@localhost:5432/prestamos_test
          SUPABASE_JWT_SECRET: test-secret
          SUPABASE_URL: http://localhost
          ENVIRONMENT: test
        run: |
          alembic upgrade head
          pytest -v --cov=app --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        working-directory: ./backend
        run: |
          docker build -t prestamos-backend .
      
      # Deploy to Railway/Render would be configured separately
      # This is just a build verification
