name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  # Sin filtro de rutas: los checks obligatorios deben ejecutarse en todos los PR
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prestamos
          POSTGRES_PASSWORD: prestamos_test
          POSTGRES_DB: prestamos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prestamos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://prestamos:prestamos_test@localhost:5432/prestamos_test
      JWT_SECRET: test-secret
      ALLOWED_EMAILS: "@familia.com"
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type check (mypy)
        run: mypy app/

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v --cov=app --cov-report=term-missing

  docker:
    name: Backend image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prestamos
          POSTGRES_PASSWORD: prestamos_test
          POSTGRES_DB: prestamos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prestamos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      IMAGE: ghcr.io/${{ github.repository }}-backend
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Arranca la imagen con la configuración de producción: migra la base de datos
      # y debe responder. Así no se publica una imagen que no arranca.
      - name: Smoke test
        run: |
          docker run -d --name api --network host             -e ENVIRONMENT=production             -e DATABASE_URL=postgresql://prestamos:prestamos_test@localhost:5432/prestamos_test             -e JWT_SECRET=smoke-test-secret-of-at-least-32-characters             -e REGISTRATION_CODE=smoke-test             "$IMAGE:latest"
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors             http://localhost:8000/healthz || { docker logs api; exit 1; }

      # Solo se publica lo que ya está en main. El despliegue sigue siendo de Render,
      # que construye la suya al pasar los checks (ver render.yaml).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push --all-tags "$IMAGE"
