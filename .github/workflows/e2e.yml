name: End-to-end

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prestamos
          POSTGRES_PASSWORD: prestamos_test
          POSTGRES_DB: prestamos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prestamos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://prestamos:prestamos_test@localhost:5432/prestamos_test
      JWT_SECRET: test-secret
      ALLOWED_EMAILS: "@familia.com"
      ADMIN_EMAIL: admin@familia.com
      ENVIRONMENT: test
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Start backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > ../backend.log 2>&1 &

      # Se prueba el build de producción, no el servidor de desarrollo
      - name: Build and serve frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5173 --strictPort > ../frontend.log 2>&1 &

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Wait for the app
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8000/healthz > /dev/null; do sleep 1; done'
          timeout 60 bash -c 'until curl -sf http://localhost:5173 > /dev/null; do sleep 1; done'

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload report and logs
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend.log
            frontend.log
          retention-days: 7
