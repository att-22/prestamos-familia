version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: prestamos-db
    environment:
      POSTGRES_USER: prestamos
      POSTGRES_PASSWORD: prestamos_dev
      POSTGRES_DB: prestamos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prestamos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: prestamos-api
    environment:
      DATABASE_URL: postgresql://prestamos:prestamos_dev@postgres:5432/prestamos
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      # Quién puede registrarse: emails o dominios separados por comas
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-@familia.com}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      # Cuenta que administra los correos autorizados desde la app
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@familia.com}
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: prestamos-web
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
