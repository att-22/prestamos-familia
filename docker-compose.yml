version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: prestamos-db
    environment:
      POSTGRES_USER: prestamos
      POSTGRES_PASSWORD: prestamos_dev
      POSTGRES_DB: prestamos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prestamos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: prestamos-api
    environment:
      DATABASE_URL: postgresql://prestamos:prestamos_dev@postgres:5432/prestamos
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-dev-secret-change-in-prod}
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: prestamos-web
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
