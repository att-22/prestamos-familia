[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
# Explicit, so that upgrading ruff does not silently change what is checked
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
