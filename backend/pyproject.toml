[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
# Explicit, so that upgrading ruff does not silently change what is checked:
# pycodestyle, pyflakes, import order, modern syntax and likely bugs.
select = ["E", "F", "I", "UP", "B"]
# No formatter is enforced, so line length is left to judgement
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as default arguments
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
